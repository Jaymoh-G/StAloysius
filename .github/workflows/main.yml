on: push
name: 🚀 Deploy Laravel as ZIP

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v2

      - name: 🧰 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🔐 Copy .env.example to .env
        run: cp .env.example .env

      - name: 🧶 Composer install
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: 🧰 Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 NPM install
        run: npm install

      - name: 🛠️ Build assets
        run: npm run build

      - name: ⚙️ Laravel optimization
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: 🗜️ Zip deployment package
        run: |
          zip -r deploy.zip . -x "node_modules/*" "tests/*" ".git/*" ".github/*" ".env" "storage/*"

      - name: 📤 Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.sagnairobi.org
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          server-dir: /public_html/staging.sagnairobi.org/
          exclude: |
            *
          include: |
            deploy.zip
